        whenEn: "Used to describe activities done on the previous Saturday and Sunday.",
        position: "📌 Al inicio con coma.",
        formula: "Last weekend, + I / We + [verbo en pasado]...",
        exampleEn: "Last weekend, I visited my grandparents and we had lunch together.",
        exampleEs: "El fin de semana pasado, visité a mis abuelos y almorzamos juntos."
      },
      {

      {

        es: "El lunes / El sábado / El domingo,",

        whenEn: "GOLDEN RULE: In English, always use ON with days of the week (never 'in' or 'at').",
        position: "📌 Al inicio de la oración para ordenar los días de la semana.",
        formula: "On [Day], + I / We + [verbo en pasado]...",
        exampleEn: "On Saturday, I bought groceries at the supermarket and visited my grandparents.",
        exampleEs: "El sábado, compré mercadería en el supermercado y visité a mis abuelos."
      },
      {
        id: "in-year",

        es: "En 2025 / En enero,",

        whenEn: "GOLDEN RULE: Always use IN with years and months.",
        position: "📌 Al principio para indicar la fecha histórica o año de tu vivencia.",
        formula: "In [Year/Month], + I / We + [verbo en pasado]...",
        exampleEn: "In 2025, we traveled to the coast and stayed at a hotel.",
        exampleEs: "En 2025, viajamos a la costa y nos quedamos en un hotel."

      {

        es: "... hace dos días / hace una semana",

        whenEn: "'Ago' means in the past. Used to indicate how much time has passed.",

    const sequenceConnectorsData = [

      {

        es: "Luego / Después,",

        exampleEs: "Finalmente, volvimos a casa y me sentí muy feliz por nuestro viaje."

    const logicConnectorsData = [
      {
        connector: "because",
        es: "porque (explica la causa o razón)",

        whenEn: "Explains the reason or cause of an action (answers 'Why?').",
        commaRule: "⚠️ ¡OJO!: En inglés 'because' va en el medio uniendo dos ideas y NO lleva coma antes.",
        formula: "[Acción principal en pasado] + because + [Sujeto] + [Verbo en pasado / Motivo]",
        exampleEn: "I went to Quintero beach because I wanted to explore the coast.",
        exampleEs: "Fui a la playa de Quintero porque quería explorar la costa."
      },
      {
        connector: "and",
        es: "y (adición / suma de ideas)",
        when: "Suma dos acciones que hiciste o dos cualidades del clima que ocurrieron al mismo tiempo.",
        whenEn: "Connects two similar actions or two weather qualities.",
        commaRule: "📌 No lleva coma cuando une dos verbos simples con el mismo sujeto.",
        formula: "[Verbo 1] + and + [Verbo 2]  O  [Adjetivo 1] + and + [Adjetivo 2]",
        exampleEn: "The weather was sunny and warm.",
        exampleEs: "El clima estaba soleado y cálido."
      },
      {
        connector: ", but",
        es: "pero (contraste / imprevisto)",
        when: "Introduce un cambio inesperado, un contraste o un imprevisto que alteró los planes (ej: querías caminar pero se puso muy frío).",
        whenEn: "Introduces an unexpected contrast or change of plans/weather.",
        commaRule: "⚠️ ¡REGLA CLAVE!: En inglés 'but' SIEMPRE lleva una coma antes (, but).",
        formula: "[Acción o intención], but + [Imprevisto o cambio de clima en pasado]",
        exampleEn: "We walked on the beach, but the wind suddenly became very cold.",
        exampleEs: "Caminamos por la playa, pero el viento de repente se puso muy frío."
      },
      {
        connector: ", so",
        es: "así que / por lo tanto (consecuencia)",
        when: "Indica el resultado o la consecuencia lógica de una situación que ocurrió.",
        whenEn: "Shows the result or consequence of a situation.",
        commaRule: "📌 Lleva una coma antes (, so).",
        formula: "[Situación ocurrida], so + [Consecuencia o decisión tomada]",
        exampleEn: "It started to rain, so we didn't stay on the beach.",
        exampleEs: "Empezó a llover, así que no nos quedamos en la playa."

            &nbsp;&nbsp;↳ <i>"<b>Last week,</b> I stayed at home..."</i> &nbsp;|&nbsp; <i>"<b>First,</b> I arrived at a hotel..."</i> &nbsp;|&nbsp; <i>"<b>Finally,</b> we returned home..."</i><br>

    function toggleConnectorsTab(tabName) {
      const tabs = ['time', 'sequence', 'logic', 'builder', 'models'];
      tabs.forEach(t => {
        const sec = document.getElementById(`section-tab-${t}`);
        const btn = document.getElementById(`btn-tab-${t}`);
        if (sec) sec.style.display = (t === tabName) ? 'block' : 'none';
        if (btn) {
          if (t === tabName) {
            btn.style.background = 'rgba(59, 130, 246, 0.3)';
            btn.style.borderColor = '#3b82f6';
            btn.style.color = '#fff';
          } else {
            btn.style.background = 'transparent';
            btn.style.borderColor = 'rgba(255, 255, 255, 0.15)';
            btn.style.color = '#cbd5e1';
          }
        }
      });
    }

    function setBuilderPart(part, enVal, esVal, btnEl) {
      builderState[part] = enVal;
      builderState[part + 'Es'] = esVal;

      // Actualizar estilo activo de botones
      const groupBtns = document.querySelectorAll(`.builder-btn-${part}`);
      groupBtns.forEach(b => {
        b.style.background = 'transparent';
        b.style.borderColor = 'rgba(255,255,255,0.15)';
        b.style.color = '#cbd5e1';
      });
      if (btnEl) {
        btnEl.style.background = 'rgba(139, 92, 246, 0.35)';
        btnEl.style.borderColor = '#a78bfa';
        btnEl.style.color = '#fff';
      }

      // Renderizar resultado
      const enBox = document.getElementById('builder-result-en');
      const esBox = document.getElementById('builder-result-es');

      const fullEn = `${builderState.time} ${builderState.subject} ${builderState.action} ${builderState.connector}`;
      const fullEs = `${builderState.timeEs} ${builderState.subjectEs} ${builderState.actionEs} ${builderState.connectorEs}`;

      if (enBox) enBox.textContent = fullEn;
      if (esBox) esBox.textContent = fullEs;
    }

    function speakBuilderSentence() {
      const fullEn = `${builderState.time} ${builderState.subject} ${builderState.action} ${builderState.connector}`;
      speak(fullEn);
    }

    function copyBuilderSentence() {
      const fullEn = `${builderState.time} ${builderState.subject} ${builderState.action} ${builderState.connector}`;
      navigator.clipboard.writeText(fullEn);
      alert('¡Oración copiada al portapapeles!\n\n' + fullEn);
    }
