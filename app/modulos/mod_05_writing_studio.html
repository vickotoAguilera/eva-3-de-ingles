                  ✅ ¿Cuándo se usa "went"? (En afirmativo)
                </h4>
                <p style="font-size:13px; color:#cbd5e1; line-height:1.55; margin:0;">
                  Se usa en <b>oraciones afirmativas en pasado</b> cuando cuentas adónde fuiste o adónde fue alguien:<br>
                  • En la <b>Oración 1</b>: <i>"Last summer, I <b>went</b> to Quintero..."</i> (El verano pasado, fui a Quintero...).<br>
                  • En la <b>Oración 8</b> (Semana): <i>"Finally, I <b>went</b> to bed early..."</i> (Finalmente me fui a acostar temprano).
                </p>
              </div>

              <!-- Las 2 Trampas -->
              <div style="background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); border-radius:8px; padding:14px;">
                <h4 style="color:#f87171; margin:0 0 6px 0; font-size:14px;">
                  ⚠️ Las 2 Trampas de la prueba que DEBES evitar:
                </h4>
                <ul style="font-size:13px; color:#cbd5e1; line-height:1.55; margin:0; padding-left:18px;">
                  <li><b>NUNCA escribas "goed" ❌</b>: En inglés no existe "goed". Como es irregular, cambia totalmente a <b>went</b>.</li>
                  <li><b>Con "didn't" o "did" vuelve a "go"</b>:<br>
                    • Afirmativo: <i>I <b>went</b> to the beach</i> ✅ (Fui a la playa).<br>
                    • Negativo: <i>I didn't <b>go</b> to the beach</i> ✅ (NO <i>"didn't went"</i> ❌).<br>
                    • Pregunta: <i>Did you <b>go</b> to the beach?</i> ✅ (NO <i>"Did you went"</i> ❌).
                  </li>
                </ul>

    function toggleWritingGuideTab(tab) {
      const tabs = ['went', 'verbs', 'connectors', 'weather'];
      tabs.forEach(t => {
        const el = document.getElementById(`writing-guide-${t}`);
        const btn = document.getElementById(`tab-btn-${t}`);
        if (el) el.style.display = (t === tab) ? 'block' : 'none';
        if (btn) {
          if (t === tab) {
            btn.style.background = 'rgba(59, 130, 246, 0.3)';
            btn.style.borderColor = '#3b82f6';
            btn.style.color = '#fff';
          } else {
            btn.style.background = 'transparent';
            btn.style.borderColor = 'rgba(255, 255, 255, 0.15)';
            btn.style.color = '#cbd5e1';
          }
        }
      });
    }

    function useSentenceExample(num, type) {
      const g = sentenceGuides.find(x => x.num === num);
      if (!g) return;
      const text = (type === 'vacation') ? g.vacation : g.week;
      const inp = document.getElementById(`sent-${num}`);
      if (inp) {
        inp.value = text;
        inp.focus();
        inp.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function speakSentenceGuideExample(num, type) {
      const g = sentenceGuides.find(x => x.num === num);
      if (!g) return;
      const text = (type === 'vacation') ? g.vacation : g.week;
      speak(text);
    }

                  <span style="color:#38bdf8; font-weight:600;">🏖️ Ejemplo Vacaciones:</span> 
                  <span style="color:#fff;">"${g.vacation}"</span><br>
                  <span style="color:#94a3b8; font-size:11.5px; margin-left:18px;">↳ <i>Español:</i> "${g.vacationEs}"</span>
                  <div style="margin-left:18px; margin-top:4px; display:inline-flex; gap:6px;">
                    <button class="btn btn-secondary" onclick="speakSentenceGuideExample(${g.num}, 'vacation')" style="font-size:10.5px; padding:2px 8px;">🔊 Escuchar</button>
                    <button class="btn btn-secondary" onclick="useSentenceExample(${g.num}, 'vacation')" style="font-size:10.5px; padding:2px 8px; color:#38bdf8; border-color:rgba(56,189,248,0.4);">📋 Usar como base</button>
                  </div>
                </div>

                <div>
                  <span style="color:#a78bfa; font-weight:600;">📅 Ejemplo Semana Pasada:</span> 
                  <span style="color:#fff;">"${g.week}"</span><br>
                  <span style="color:#94a3b8; font-size:11.5px; margin-left:18px;">↳ <i>Español:</i> "${g.weekEs}"</span>
                  <div style="margin-left:18px; margin-top:4px; display:inline-flex; gap:6px;">
                    <button class="btn btn-secondary" onclick="speakSentenceGuideExample(${g.num}, 'week')" style="font-size:10.5px; padding:2px 8px;">🔊 Escuchar</button>
                    <button class="btn btn-secondary" onclick="useSentenceExample(${g.num}, 'week')" style="font-size:10.5px; padding:2px 8px; color:#a78bfa; border-color:rgba(167,139,250,0.4);">📋 Usar como base</button>
                  </div>
                </div>
              </div>

              <!-- Vocabulario clave de esta oración -->
              <div style="margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.08);">
                <div style="font-size:11px; font-weight:700; color:#93c5fd; margin-bottom:5px;">🔑 Vocabulario clave de esta oración (¿qué significa cada palabra?):</div>
                <div style="display:flex; flex-wrap:wrap; gap:4px;">
                  ${vocabHtml}
                </div>
              </div>
            </div>

            <div style="margin-top:12px;">
              <label for="sent-${g.num}" style="display:block; font-size:12.5px; font-weight:700; color:#93c5fd; margin-bottom:6px;">
                ✍️ Tu Oración ${g.num} (Escribe en inglés):
              </label>
              <textarea id="sent-${g.num}" class="writing-sentence-input" rows="2" placeholder="Escribe aquí tu Oración ${g.num} en inglés..."></textarea>
            </div>
          </div>
        `;
      });
    }

    function loadWritingExample(type) {
      const arr = (type === 'vacation') ? vacationSentences : lastWeekSentences;
      arr.forEach((s, idx) => {
        const inp = document.getElementById(`sent-${idx+1}`);
        if (inp) inp.value = s;
      });
      verifyWriting();
    }

    function clearWritingInputs() {
      for (let i = 1; i <= 8; i++) {
        const inp = document.getElementById(`sent-${i}`);
        if (inp) inp.value = '';
      }
      const res = document.getElementById('writing-results');
      if (res) res.style.display = 'none';
    }

    function verifyWriting() {
      const results = document.getElementById('writing-results');
      results.style.display = 'block';

      let textTotal = '';
      let checklist = {
        count: 0,
        hasRegular: false,
        hasIrregular: false,
        hasAnd: false,
        hasBut: false,
        hasBecause: false,
        hasFirst: false,
        hasThen: false,
        hasAfterThat: false,
        hasFinally: false,
        hasWeather: false
      };

      let errorsList = [];
      let sentencesArray = [];

      for (let i = 1; i <= 8; i++) {
        const val = (document.getElementById(`sent-${i}`)?.value || '').trim();
        if (val.length > 5) {
          checklist.count++;
          sentencesArray.push(val);
          textTotal += val + ' ';

          // Comprobar errores ortográficos o de conjugación típicos
          if (/raiseed/i.test(val)) errorsList.push(`Oración ${i}: Error en 'raiseed'. 'raise' ya termina en 'e', solo agrega 'd' (raised).`);
          if (/studyed/i.test(val)) errorsList.push(`Oración ${i}: Error en 'studyed'. Consonante + 'y' cambia a 'studied'.`);
          if (/planed/i.test(val)) errorsList.push(`Oración ${i}: Error en 'planed'. Debe duplicar la n: 'planned'.`);
          if (/goed/i.test(val)) errorsList.push(`Oración ${i}: 'go' es irregular. Se escribe 'went', jamás 'goed'.`);
          if (/taked/i.test(val)) errorsList.push(`Oración ${i}: 'take' es irregular. Se escribe 'took', jamás 'taked'.`);
          if (/buyed/i.test(val)) errorsList.push(`Oración ${i}: 'buy' es irregular. Se escribe 'bought', jamás 'buyed'.`);
          if (/eated/i.test(val)) errorsList.push(`Oración ${i}: 'eat' es irregular. Se escribe 'ate', jamás 'eated'.`);
          if (/seed/i.test(val)) errorsList.push(`Oración ${i}: 'see' es irregular. Se escribe 'saw', jamás 'seed'.`);
          if (/didn't went/i.test(val)) errorsList.push(`Oración ${i}: Después de 'didn't' se usa verbo base: 'didn't go', no 'didn't went'.`);
          if (/Wheater/i.test(val)) errorsList.push(`Oración ${i}: Corrección ortográfica: se escribe 'weather', no 'Wheater'.`);
          if (/explore the beautiful/i.test(val) && !/wanted to explore|explored/i.test(val)) errorsList.push(`Oración ${i}: 'explore' está en presente simple. En pasado debes poner 'explored' o 'wanted to explore'.`);
          if (/then we visit/i.test(val)) errorsList.push(`Oración ${i}: 'visit' está en presente simple. En pasado debe ser 'visited'.`);
          if (/then I study/i.test(val)) errorsList.push(`Oración ${i}: 'study' está en presente. En pasado debe ser 'studied'.`);
          if (/I clean my room/i.test(val)) errorsList.push(`Oración ${i}: 'clean' está en presente. En pasado debe ser 'cleaned'.`);
        }
      }

      // Analizar pauta en el texto completo (soporta tanto viaje como semana pasada)
      const lower = textTotal.toLowerCase();
      if (/visited|walked|tasted|arrived|returned|started|explored|loved|cleaned|studied|watched|cooked|played|rested|enjoyed|listened|talked|prepared|practiced/.test(lower)) checklist.hasRegular = true;
      if (/went|took|bought|had|became|felt|was|were|ate|drank|saw|made|did|read|got|met/.test(lower)) checklist.hasIrregular = true;
      if (/\band\b/.test(lower)) checklist.hasAnd = true;
      if (/\bbut\b/.test(lower)) checklist.hasBut = true;
      if (/\bbecause\b/.test(lower)) checklist.hasBecause = true;
      if (/\bfirst\b/.test(lower)) checklist.hasFirst = true;
      if (/\bthen\b/.test(lower)) checklist.hasThen = true;
      if (/after that/.test(lower)) checklist.hasAfterThat = true;
      if (/\bfinally\b/.test(lower)) checklist.hasFinally = true;
      if (/sunny|warm|cold|wind|windy|rain|rainy|cloudy|clouds|snow|cool|weather/.test(lower)) checklist.hasWeather = true;

      const allChecksPass = (checklist.count === 8 && checklist.hasRegular && checklist.hasIrregular &&
                             checklist.hasAnd && checklist.hasBut && checklist.hasBecause &&
                             checklist.hasFirst && checklist.hasThen && checklist.hasAfterThat &&
                             checklist.hasFinally && checklist.hasWeather && errorsList.length === 0);

      results.innerHTML = `
        <div style="font-size:18px; font-weight:800; color:${allChecksPass ? '#34d399' : '#f87171'}; margin-bottom:12px;">
          ${allChecksPass ? '🎉 ¡EXCELENTE! Tu redacción cumple con el 100% de la pauta y no tiene errores.' : '⚠️ Revisión en progreso: Chequea las observaciones a continuación para sacar un 7.0:'}
        </div>

        ${errorsList.length > 0 ? `
          <div class="feedback-box incorrect" style="display:block; margin-bottom:16px;">
            <b>❌ Errores ortográficos o gramaticales detectados:</b><br>
            ${errorsList.map(e => `• ${e}`).join('<br>')}
          </div>
        ` : ''}

        <h4 style="color:#93c5fd; margin-bottom:8px;">Checklist de Requisitos de la Pauta Oficial:</h4>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:13.5px;">
          <div>${checklist.count === 8 ? '✅' : '❌'} 8 Oraciones escritas (${checklist.count}/8)</div>
          <div>${checklist.hasRegular ? '✅' : '❌'} Verbos regulares en pasado (-ed)</div>
          <div>${checklist.hasIrregular ? '✅' : '❌'} Verbos irregulares en pasado (went, took, bought, had, felt)</div>
          <div>${checklist.hasBecause ? '✅' : '❌'} Conector de causa: <b>because</b></div>
          <div>${checklist.hasAnd ? '✅' : '❌'} Conector de adición: <b>and</b></div>
          <div>${checklist.hasBut ? '✅' : '❌'} Conector de contraste: <b>but</b></div>
          <div>${checklist.hasFirst ? '✅' : '❌'} Secuencia obligatoria: <b>First</b></div>
          <div>${checklist.hasThen ? '✅' : '❌'} Secuencia obligatoria: <b>Then</b></div>
          <div>${checklist.hasAfterThat ? '✅' : '❌'} Secuencia obligatoria: <b>After that</b></div>
          <div>${checklist.hasFinally ? '✅' : '❌'} Secuencia obligatoria: <b>Finally</b></div>
          <div>${checklist.hasWeather ? '✅' : '❌'} Vocabulario de Clima (sunny, warm, cold, wind, rain, cloudy)</div>
        </div>
      `;
    }

    function copyAllSentences() {
      let t = '';
      for (let i = 1; i <= 8; i++) {
        t += `${i}. ${document.getElementById(`sent-${i}`)?.value || ''}\n`;
      }
      navigator.clipboard.writeText(t);
      alert('¡Tus 8 oraciones han sido copiadas al portapapeles!');
    }

    function speakAllWriting() {
      let t = '';
      for (let i = 1; i <= 8; i++) {
        t += (document.getElementById(`sent-${i}`)?.value || '') + '. ';
      }
      if (t.trim().length < 5) {
        alert('Por favor escribe algunas oraciones o carga un ejemplo primero.');
        return;
      }
      speak(t);
    }

    document.addEventListener('DOMContentLoaded', () => { 
      renderWritingStudio(document.getElementById('module-container')); 
    });
  </script>
</body>
</html>
