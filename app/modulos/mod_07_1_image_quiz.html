                  <div style="font-size:11px; font-weight:800; color:#93c5fd; text-transform:uppercase;">📌 Apertura (Identificar la foto):</div>
                  <div style="font-size:14px; color:#fff; font-weight:700;">"This is a picture of my sister and me in Alaska."</div>
                  <div style="font-size:12px; color:#94a3b8;">↳ <i>Esta es una foto de mi hermana y yo en Alaska.</i></div>
                </div>
                <button class="btn btn-secondary" style="padding:4px 10px; font-size:12px;" onclick="speak('This is a picture of my sister and me in Alaska.')">🔊</button>
              </div>

              <!-- Where & When -->
              <div style="background:rgba(30, 41, 59, 0.6); padding:10px 14px; border-radius:8px; border-left:3px solid #10b981; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <div style="font-size:11px; font-weight:800; color:#6ee7b7; text-transform:uppercase;">📍 (Where & When) Lugar y Tiempo:</div>
                  <div style="font-size:14px; color:#fff; font-weight:700;">"It was at an Alaskan port last month."</div>
                  <div style="font-size:12px; color:#94a3b8;">↳ <i>Fue en un puerto de Alaska el mes pasado.</i></div>
                </div>
                <button class="btn btn-secondary" style="padding:4px 10px; font-size:12px;" onclick="speak('It was at an Alaskan port last month.')">🔊</button>
              </div>

              <!-- Weather -->
              <div style="background:rgba(30, 41, 59, 0.6); padding:10px 14px; border-radius:8px; border-left:3px solid #06b6d4; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <div style="font-size:11px; font-weight:800; color:#67e8f9; text-transform:uppercase;">☁️ (Weather) Clima:</div>
                  <div style="font-size:14px; color:#fff; font-weight:700;">"It was cloudy and cold."</div>
                  <div style="font-size:12px; color:#94a3b8;">↳ <i>Estaba nublado y frío.</i></div>
                </div>
                <button class="btn btn-secondary" style="padding:4px 10px; font-size:12px;" onclick="speak('It was cloudy and cold.')">🔊</button>
              </div>

              <!-- Feeling & Reason -->
              <div style="background:rgba(30, 41, 59, 0.6); padding:10px 14px; border-radius:8px; border-left:3px solid #ef4444; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <div style="font-size:11px; font-weight:800; color:#fca5a5; text-transform:uppercase;">🌧️ (Feeling) Sentimiento & (Because) Razón:</div>
                  <div style="font-size:14px; color:#fff; font-weight:700;">"I hate rainy days because we can't go out much."</div>
                  <div style="font-size:12px; color:#94a3b8;">↳ <i>(Feeling) Odio los días lluviosos porque (Because) no podemos salir mucho.</i></div>
                </div>
                <button class="btn btn-secondary" style="padding:4px 10px; font-size:12px;" onclick="speak('I hate rainy days because we cannot go out much.')">🔊</button>
              </div>
            </div>
          </div>

          <!-- 5 FRASES DE OPINIÓN Y CLIMA CON 'BECAUSE' -->
          <div style="background:rgba(15, 23, 42, 0.8); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:18px;">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
              <span style="font-size:22px;">💬</span>
              <div>
                <h3 style="font-size:16px; color:#6ee7b7; margin:0;">5 Frases de Opinión y Clima de Alto Puntaje (Oxford Test)</h3>
                <span style="font-size:12px; color:#94a3b8;">Estructuras indispensables con 'In my opinion', 'because' y 'because of'</span>
              </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:8px;">
              <!-- Frase 1 -->
              <div style="background:rgba(30, 41, 59, 0.6); padding:10px 14px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <div style="font-size:13.5px; color:#fff; font-weight:700;">1. "I don’t like snow because it's very cold."</div>
                  <div style="font-size:12px; color:#94a3b8;">↳ <i>No me gusta la nieve porque es muy fría.</i> (Causa con <b>because + it's</b>)</div>
                </div>
                <button class="btn btn-secondary" style="padding:4px 10px; font-size:12px;" onclick="speak('I do not like snow because it is very cold.')">🔊</button>
              </div>

              <!-- Frase 2 -->
              <div style="background:rgba(30, 41, 59, 0.6); padding:10px 14px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <div style="font-size:13.5px; color:#fff; font-weight:700;">2. "I love hot weather because I can go to the beach."</div>
                  <div style="font-size:12px; color:#94a3b8;">↳ <i>Me encanta el clima caluroso porque puedo ir a la playa.</i> (Gusto con <b>can + base verb</b>)</div>
                </div>
                <button class="btn btn-secondary" style="padding:4px 10px; font-size:12px;" onclick="speak('I love hot weather because I can go to the beach.')">🔊</button>
              </div>

              <!-- Frase 3 -->
              <div style="background:rgba(30, 41, 59, 0.6); padding:10px 14px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <div style="font-size:13.5px; color:#fff; font-weight:700;">3. "In my opinion, the weather yesterday was nice because it was sunny and warm."</div>
                  <div style="font-size:12px; color:#94a3b8;">↳ <i>En mi opinión, el clima ayer estuvo agradable porque estuvo soleado y cálido.</i> (Fórmula <b>In my opinion, the weather was... because...</b>)</div>
                </div>
                <button class="btn btn-secondary" style="padding:4px 10px; font-size:12px;" onclick="speak('In my opinion, the weather yesterday was nice because it was sunny and warm.')">🔊</button>
              </div>

              <!-- Frase 4 -->
              <div style="background:rgba(30, 41, 59, 0.6); padding:10px 14px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <div style="font-size:13.5px; color:#fff; font-weight:700;">4. "We spent a lot of time outdoors over the weekend because of the holidays, and the weather was fine."</div>
                  <div style="font-size:12px; color:#94a3b8;">↳ <i>Pasamos mucho tiempo al aire libre durante el fin de semana debido a los feriados, y el clima estuvo bueno.</i> (<b>because of + sustantivo</b>)</div>
                </div>
                <button class="btn btn-secondary" style="padding:4px 10px; font-size:12px;" onclick="speak('We spent a lot of time outdoors over the weekend because of the holidays, and the weather was fine.')">🔊</button>
              </div>

              <!-- Frase 5 -->
              <div style="background:rgba(30, 41, 59, 0.6); padding:10px 14px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <div style="font-size:13.5px; color:#fff; font-weight:700;">5. "In my opinion, the weather yesterday was pleasant because it wasn't that cold."</div>
                  <div style="font-size:12px; color:#94a3b8;">↳ <i>En mi opinión, el clima ayer estuvo agradable porque no hacía tanto frío.</i> (<b>pleasant = agradable / wasn't that cold = no hacía tanto frío</b>)</div>
                </div>
                <button class="btn btn-secondary" style="padding:4px 10px; font-size:12px;" onclick="speak('In my opinion, the weather yesterday was pleasant because it was not that cold.')">🔊</button>
              </div>
            </div>
          </div>
        </div>

        ${scenesHtml}

        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:24px; margin-bottom:24px;">
          <button class="btn btn-success" style="padding:12px 24px;" onclick="solveAllImageQuiz()">
            👁️ Mostrar Todas las Respuestas Correctas con Explicación Completa
          </button>
          <button class="btn btn-secondary" style="padding:12px 20px;" onclick="resetAllImageQuiz()">
            🔄 Reiniciar Todo el Quiz
          </button>
        </div>
      `;

      updateImageQuizScore();
    }

    function evalImageOption(sceneId, qId, optIdx) {
      const scene = imageScenes.find(s => s.id === sceneId);
      if (!scene) return;
      const q = scene.questions.find(x => x.qId === qId);
      if (!q) return;
      const chosenOpt = q.options[optIdx];
      const correctOpt = q.options.find(o => o.correct);
      const fb = document.getElementById(`iq-fb-${sceneId}-${qId}`);
      if (!fb) return;

      const isRight = chosenOpt.correct;

      // Resaltar visualmente las etiquetas de las 3 opciones
      q.options.forEach((opt, idx) => {
        const lbl = document.getElementById(`iq-label-${sceneId}-${qId}-${idx}`);
        if (!lbl) return;
        lbl.classList.remove('opt-correct', 'opt-incorrect');
        if (opt.correct) {
          lbl.classList.add('opt-correct');
        } else if (idx === optIdx && !isRight) {
          lbl.classList.add('opt-incorrect');
        }
      });

      // Construir el análisis de las 2 alternativas que no son la correcta
      let wrongAltsHtml = '';
      q.options.forEach((opt, idx) => {
        if (!opt.correct) {
          wrongAltsHtml += `
            <div class="alt-item-box">
              <div style="font-weight:700; color:#fca5a5; font-size:13.5px;">
                🚫 Alternativa "${opt.text}" (<i>${opt.textEs}</i>):
              </div>
              <div style="font-size:13px; color:#e2e8f0; margin-top:3px; line-height:1.45;">
                • <b>Por qué NO corresponde a esta foto:</b> ${opt.why}
              </div>
              ${opt.exampleWhereCorrectEn ? `
                <div class="example-bubble">
                  <div style="font-weight:700; color:#6ee7b7; margin-bottom:2px;">🌟 ¿Cuándo SÍ sería correcta "${opt.text}"?</div>
                  <i>"${opt.exampleWhereCorrectEn}"</i><br>
                  <span style="color:#cbd5e1; font-size:12px;">↳ Español: ${opt.exampleWhereCorrectEs}</span>
                </div>
              ` : ''}
            </div>
          `;
        }
      });

      fb.className = `feedback-box ${isRight ? 'correct' : 'incorrect'}`;
      fb.style.display = 'block';
      fb.innerHTML = `
        <div class="badge-result-status ${isRight ? 'correct' : 'incorrect'}">
          ${isRight 
            ? `✔️ ¡RESPUESTA CORRECTA! Acertaste con la foto.` 
            : `❌ RESPUESTA INCORRECTA (Elegiste: "${chosenOpt.text}" | La correcta es: "<b>${correctOpt.text}</b>")`}
        </div>

        <div style="background:rgba(16,185,129,0.12); border-left:4px solid #10b981; padding:12px 14px; border-radius:6px; margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <div style="font-weight:800; color:#6ee7b7; font-size:14px;">🎯 ¿Por qué "${correctOpt.text}" es la respuesta correcta?</div>
            <button class="btn btn-secondary" style="padding:3px 8px; font-size:11px;" onclick="speak('${correctOpt.text.replace(/'/g, "\'")}')">🔊 Escuchar</button>
          </div>
          <div style="font-size:13.5px; color:#f3f4f6; line-height:1.5;">${correctOpt.why}</div>
        </div>

        <div class="comparative-box">
          <div style="font-weight:800; font-size:13.5px; color:#93c5fd; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.04em;">
            🔍 Por qué las otras 2 opciones NO corresponden (y ejemplos de cuándo sí):
          </div>
          ${wrongAltsHtml}
        </div>
      `;

      imageQuizScores[`${sceneId}-${qId}`] = isRight;
      updateImageQuizScore();
    }

    function evalImageWritten(sceneId) {
      const scene = imageScenes.find(s => s.id === sceneId);
      if (!scene) return;
      const wp = scene.writtenPractice;
      const inputEl = document.getElementById(`iq-written-inp-${sceneId}`);
      const fb = document.getElementById(`iq-written-fb-${sceneId}`);
      if (!inputEl || !fb) return;

      const val = inputEl.value.trim();
      if (!val) {
        fb.style.display = 'none';
        inputEl.className = 'written-input';
        return;
      }

      const res = wp.eval(val);
      fb.style.display = 'block';

      if (res.ok) {
        inputEl.className = `written-input ${res.status === 'tolerant' ? 'is-tolerant' : 'is-correct'}`;
        fb.className = 'feedback-box correct';
        fb.innerHTML = `
          <div class="badge-result-status correct">✔️ ¡RESPUESTA CORRECTA!</div>
          <div style="font-size:13.5px; margin-top:4px;">${res.msg}</div>
        `;
        imageQuizScores[`${sceneId}-w`] = true;
      } else {
        inputEl.className = 'written-input is-incorrect';
        fb.className = 'feedback-box incorrect';
        fb.innerHTML = `
          <div class="badge-result-status incorrect">❌ RESPUESTA INCORRECTA</div>
          <div style="font-size:13.5px; margin-top:4px;">${res.msg}</div>
        `;
        imageQuizScores[`${sceneId}-w`] = false;
      }

      updateImageQuizScore();
    }

    function revealImageWritten(sceneId) {
      const scene = imageScenes.find(s => s.id === sceneId);
      if (!scene) return;
      const inputEl = document.getElementById(`iq-written-inp-${sceneId}`);
      if (inputEl) {
        inputEl.value = scene.writtenPractice.expected;
        evalImageWritten(sceneId);
      }
    }

    function updateImageQuizScore() {
      const display = document.getElementById('iq-score-display');
      if (!display) return;
      let correct = 0;
      Object.values(imageQuizScores).forEach(v => {
        if (v === true) correct++;
      });
      const totalActivities = imageScenes.length * 5;
      display.textContent = `${correct} de ${totalActivities} actividades completadas correctamente`;
    }

    function solveAllImageQuiz() {
      imageScenes.forEach(scene => {
        scene.questions.forEach(q => {
          const correctIdx = q.options.findIndex(o => o.correct);
          if (correctIdx !== -1) {
            const radio = document.querySelector(`input[name="iq-opt-${scene.id}-${q.qId}"][value="${correctIdx}"]`);
            if (radio) radio.checked = true;
            evalImageOption(scene.id, q.qId, correctIdx);
          }
        });
        revealImageWritten(scene.id);
      });
    }

    function resetAllImageQuiz() {
      imageScenes.forEach(scene => {
        scene.questions.forEach(q => {
          const radios = document.querySelectorAll(`input[name="iq-opt-${scene.id}-${q.qId}"]`);
          radios.forEach(r => r.checked = false);
          const fb = document.getElementById(`iq-fb-${scene.id}-${q.qId}`);
          if (fb) fb.style.display = 'none';
          q.options.forEach((opt, idx) => {
            const lbl = document.getElementById(`iq-label-${scene.id}-${q.qId}-${idx}`);
            if (lbl) lbl.classList.remove('opt-correct', 'opt-incorrect');
          });
        });
        const inp = document.getElementById(`iq-written-inp-${scene.id}`);
        const fbW = document.getElementById(`iq-written-fb-${scene.id}`);
        if (inp) {
          inp.value = '';
          inp.className = 'written-input';
        }
        if (fbW) fbW.style.display = 'none';
      });
      imageQuizScores = {};
      LocalDB.saveModule('mod7_1_scores', {});
      updateImageQuizScore();
    }

    onDOMReady( () => { 
      renderImageQuiz(document.getElementById('module-container')); 
    });
  </script>
</body>
</html>
